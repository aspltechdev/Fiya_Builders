<!doctype html>
<html lang="en">
  <head>
    <!-- ==========================================================
         BASIC
    =========================================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#111111"
    />

    <!-- ==========================================================
         FAVICON
    =========================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="/logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="/logo.png"
    />


    <!-- ==========================================================
         PRIMARY SEO
    =========================================================== -->

    <title>
      FIYA Builders | Premium Builders & Construction Company in Pondicherry
    </title>

    <meta
      name="description"
      content="FIYA Builders is a premium construction company in Pondicherry, India, specializing in residential and commercial construction, architectural projects, renovation and quality-built spaces."
    />

    <meta
      name="keywords"
      content="FIYA Builders, Fiya Builders Pondicherry, builders in Pondicherry, construction company in Pondicherry, construction company Puducherry, builders in Puducherry, residential construction Pondicherry, commercial construction Pondicherry, house construction Pondicherry, building contractors Pondicherry, construction contractors Pondicherry, premium builders Pondicherry"
    />

    <meta
      name="author"
      content="FIYA Builders"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />


    <!-- ==========================================================
         CANONICAL
    =========================================================== -->

    <link
      rel="canonical"
      href="https://fiyabuilders.in/"
    />


    <!-- ==========================================================
         OPEN GRAPH
    =========================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="FIYA Builders | Premium Builders & Construction Company in Pondicherry"
    />

    <meta
      property="og:description"
      content="Premium residential and commercial construction by FIYA Builders in Pondicherry. Building quality spaces with precision, trust and excellence."
    />

    <meta
      property="og:url"
      content="https://fiyabuilders.in/"
    />

    <meta
      property="og:site_name"
      content="FIYA Builders"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <meta
      property="og:image"
      content="https://fiyabuilders.in/logo.png"
    />

    <meta
      property="og:image:alt"
      content="FIYA Builders - Premium Construction Company in Pondicherry"
    />


    <!-- ==========================================================
         TWITTER / X
    =========================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="FIYA Builders | Premium Construction Company in Pondicherry"
    />

    <meta
      name="twitter:description"
      content="FIYA Builders delivers premium residential and commercial construction projects in Pondicherry and Puducherry."
    />

    <meta
      name="twitter:image"
      content="https://fiyabuilders.in/logo.png"
    />

    <meta
      name="twitter:image:alt"
      content="FIYA Builders"
    />


    <!-- ==========================================================
         LOCAL SEO
    =========================================================== -->

    <meta
      name="geo.region"
      content="IN-PY"
    />

    <meta
      name="geo.placename"
      content="Pondicherry, Puducherry, India"
    />


    <!-- ==========================================================
         STRUCTURED DATA - ORGANIZATION
    =========================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "FIYA Builders",
        "url": "https://fiyabuilders.in/",
        "logo": "https://fiyabuilders.in/logo.png",
        "description": "Premium residential and commercial construction company in Pondicherry, India.",
        "areaServed": [
          {
            "@type": "City",
            "name": "Pondicherry"
          },
          {
            "@type": "AdministrativeArea",
            "name": "Puducherry"
          }
        ]
      }
    </script>

  </head>


  <!-- ============================================================
       BODY
  ============================================================= -->

  <body>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>

</html>
